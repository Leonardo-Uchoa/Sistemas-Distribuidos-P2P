services:
  node1:
    build: .
    container_name: educoin_node1
    environment:
      - PORT=8001
      - STATE_PATH=/data/state.json
      - CONFIG_PATH=/data/config.json
      - ADVERTISE_URL=http://node1:8001
      - SEED_PEERS=http://node2:8002,http://node3:8003
    ports:
      - "8001:8001"
    volumes:
      - node1_data:/data
    networks:
      - educoin

  node2:
    build: .
    container_name: educoin_node2
    environment:
      - PORT=8002
      - STATE_PATH=/data/state.json
      - CONFIG_PATH=/data/config.json
      - ADVERTISE_URL=http://node2:8002
      - SEED_PEERS=http://node1:8001,http://node3:8003
    ports:
      - "8002:8002"
    volumes:
      - node2_data:/data
    networks:
      - educoin

  node3:
    build: .
    container_name: educoin_node3
    environment:
      - PORT=8003
      - STATE_PATH=/data/state.json
      - CONFIG_PATH=/data/config.json
      - ADVERTISE_URL=http://node3:8003
      - SEED_PEERS=http://node1:8001,http://node2:8002
    ports:
      - "8003:8003"
    volumes:
      - node3_data:/data
    networks:
      - educoin

volumes:
  node1_data:
  node2_data:
  node3_data:

networks:
  educoin:
    driver: bridge
